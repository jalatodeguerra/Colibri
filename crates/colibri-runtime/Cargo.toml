[package]
name = "colibri-runtime"
description = "Colibri embedding API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
colibri-syntax = { path = "../colibri-syntax" }
colibri-check = { path = "../colibri-check" }
colibri-core = { path = "../colibri-core" }
colibri-vm = { path = "../colibri-vm" }
colibri-bind = { path = "../colibri-bind" }
ariadne = "0.6.0"

[features]
default = ["ffi"]
# Lets scripts call C libraries through `extern` blocks (libffi and dlopen; EMBEDDING §5). Turn it
# off (`default-features = false`) to build without the bundled libffi and its C compiler step:
# a program with an `extern` block then fails to load with an error that says why.
ffi = ["colibri-vm/ffi"]

[dev-dependencies]
colibri-ffi-testlib = { path = "../colibri-ffi-testlib" }
