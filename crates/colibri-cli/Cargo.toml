[package]
name = "colibri-lang"
description = "The Colibri programming language command line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
colibri-runtime = { path = "../colibri-runtime", default-features = false }
colibri-pack = { path = "../colibri-pack" }
colibri-syntax = { path = "../colibri-syntax" }
colibri-std = { path = "../colibri-std" }
colibri-lsp = { path = "../colibri-lsp" }
clap = { version = "4.6.8", features = ["derive"] }
ariadne = "0.6.0"
rustyline = { version = "19", default-features = false }

# `openat` with `O_NOFOLLOW`, to read an asset without following a link put in its way.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }

[features]
default = ["ffi"]
# `extern` blocks: calling C libraries (libffi). `colibri-runtime` explains the feature.
ffi = ["colibri-runtime/ffi"]

[[bin]]
name = "colibri"
path = "src/main.rs"

[[test]]
name = "golden"
harness = false

[dev-dependencies]
libtest-mimic = "0.8.2"
