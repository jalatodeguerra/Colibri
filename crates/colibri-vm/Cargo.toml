[package]
name = "colibri-vm"
description = "Colibri bytecode compiler and virtual machine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
colibri-syntax = { path = "../colibri-syntax" }
colibri-check = { path = "../colibri-check" }
colibri-core = { path = "../colibri-core" }
colibri-ffi = { path = "../colibri-ffi", optional = true }

[features]
# Calls into C libraries (`extern` blocks, `ptr[T]`): libffi and dlopen. Without it, a program
# with an `extern` block fails to load with a message that says so.
ffi = ["dep:colibri-ffi"]
