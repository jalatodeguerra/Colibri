[package]
name = "colibri-std"
description = "The Colibri standard library: io, fs, path, os, math, rand, time, json, regex, http, args, process, net and datetime as host modules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
colibri-runtime = { path = "../colibri-runtime", default-features = false }
# The pack format, for `PackAssets`: the assets of a built program (or of a page) are read from it.
colibri-pack = { path = "../colibri-pack" }
# Bit-identical sin, cos, exp, ln, pow, ... on every platform. `f64::sin` calls the C library
# of the machine, whose last digit differs between systems.
libm = "0.2.16"
# Pattern matching for `regex` (no unsafe, no C).
regex = { version = "1.12", default-features = false, features = ["std", "unicode", "perf"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "preserve_order"] }
# The modules that reach the machine (`http`, `net`, `process`, `fs`, `os`) are not in the web
# build (`target_family = "wasm"`), and neither are the crates only they use.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# A small blocking HTTP client for `http`: rustls with the bundled webpki roots, so a build
# needs no system TLS library.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Only to recognise a TLS failure that ureq wraps in an `io::Error` (`http.Error.Tls`); the
# features are those ureq already turns on.
rustls = { version = "0.23", default-features = false }
# TCP sockets for `net`: creating them with close-on-exec set at once, the non-blocking
# `connect`, `SO_REUSEADDR`, `IPV6_V6ONLY` and the listen backlog behave the same on every system.
socket2 = { version = "0.6", features = ["all"] }
# One poller thread per `Vm` for `net`: waits for the readiness of many sockets at once (epoll,
# kqueue, or the AFD driver interface on Windows) and is woken from other threads.
polling = "3"
# `memmem` for `net.Conn.read_until`: a linear search for a delimiter of several bytes.
memchr = "2.8.3"

# The machine's time zone for `datetime.now_local` (`localtime_r`), on Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `SO_EXCLUSIVEADDRUSE` (`setsockopt`) for the listeners of `net` on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Networking_WinSock"] }

# `GetProcessTimes`, for the idle-CPU test of `net` (`getrusage` is the call on Unix), and a
# snapshot of the process's threads, for the idle-threads test (`/proc/self/task` is the way on
# Linux).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
colibri-syntax = { path = "../colibri-syntax" }
