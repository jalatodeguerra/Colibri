[package]
name = "colibri-std"
description = "The Colibri standard library: io, fs, path, os, math, rand, time and json as host modules"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
colibri-runtime = { path = "../colibri-runtime", default-features = false }
# Bit-identical sin, cos, exp, ln, pow, ... on every platform. `f64::sin` calls the C library
# of the machine, whose last digit differs between systems.
libm = "0.2.16"
