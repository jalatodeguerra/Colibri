[package]
name = "colibri-runner-fixture"
description = "A project runner with a test binding, for the tests of the runner (not published)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
colibri-lang = { path = "../colibri-cli" }
colibri-runtime = { path = "../colibri-runtime" }
# `colibri-under-test` is the real `main.rs` of `colibri`, built here so the tests of delegation
# can start it with the fixture's `CARGO_BIN_EXE_*` paths in hand.
colibri-lsp = { path = "../colibri-lsp" }
clap = { version = "4.6.8", features = ["derive"] }
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }

[[bin]]
name = "colibri-runner-fixture"
path = "src/main.rs"
test = false

# A stand-in for cargo, for the tests of the runner build: it records its arguments and copies the
# fixture runner where cargo would have put the project runner.
[[bin]]
name = "fake-cargo"
path = "src/bin/fake-cargo.rs"
test = false

# `colibri` itself (its `main.rs`, unchanged), for the tests of delegation to a project runner.
[[bin]]
name = "colibri-under-test"
path = "../colibri-cli/src/main.rs"
test = false

# The fixture runner with another signature, for the tests of interfaces that follow a rebuild.
[[bin]]
name = "colibri-runner-fixture-v2"
path = "src/bin/runner-v2.rs"
test = false

# The fixture runner whose `double` triples, for the watch tests (a Rust edit that changes behaviour).
[[bin]]
name = "colibri-runner-fixture-v3"
path = "src/bin/runner-v3.rs"
test = false
