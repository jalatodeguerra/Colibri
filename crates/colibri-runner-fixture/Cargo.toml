[package]
name = "colibri-runner-fixture"
description = "A project runner with a test binding, for the tests of the runner (not published)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
colibri-lang = { path = "../colibri-cli" }
colibri-runtime = { path = "../colibri-runtime" }

[[bin]]
name = "colibri-runner-fixture"
path = "src/main.rs"

# A stand-in for cargo, for the tests of the runner build: it records its arguments and copies the
# fixture runner where cargo would have put the project runner.
[[bin]]
name = "fake-cargo"
path = "src/bin/fake-cargo.rs"
