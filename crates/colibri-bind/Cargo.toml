[package]
name = "colibri-bind"
description = "Attribute macros that export Rust types and functions to Colibri (re-exported by colibri-runtime as `colibri::export`)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
