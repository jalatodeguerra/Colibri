[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
exclude = ["examples/scripts"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jalatodeguerra/leo"

[profile.release]
# Fat LTO and one codegen unit: a smaller, faster binary, for a longer release build.
lto = "fat"
codegen-units = 1
